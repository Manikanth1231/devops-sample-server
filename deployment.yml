apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-sample-server
  labels:
    app: devops-sample-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: devops-sample-server
  template:
    metadata:
      labels:
        app: devops-sample-server
    spec:
      containers:
        - name: app
          image: devops-sample-server:latest
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "250m"
              memory: "256Mi"

